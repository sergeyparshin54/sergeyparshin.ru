<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>sergey@parshin:~$ — контакты</title>
<meta name="description" content="Сергей Паршин — AI-специалист. Контакты и соцсети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a07;--ph:#3dff8f;--ph-dim:#1d7a4a;--amber:#ffc857;--ink:#c9e8d4;--dim:#4e6b58;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow-x:hidden}
::selection{background:var(--ph);color:#03180c}

/* CRT layers */
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);}
.beam{position:fixed;left:0;right:0;height:120px;z-index:6;pointer-events:none;opacity:.06;
  background:linear-gradient(180deg,transparent,var(--ph),transparent);
  animation:beam 6s linear infinite;}
@keyframes beam{from{top:-140px}to{top:110%}}
.flick{position:fixed;inset:0;z-index:4;pointer-events:none;background:rgba(61,255,143,.03);animation:fl 4s steps(2) infinite}
@keyframes fl{0%,100%{opacity:.6}50%{opacity:.2}}
.vig{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(90% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.6))}

.term{position:relative;z-index:3;max-width:860px;margin:0 auto;min-height:100svh;
  padding:clamp(16px,4vw,44px);font-size:clamp(12.5px,1.7vw,15px);line-height:1.75;text-shadow:0 0 6px rgba(61,255,143,.35)}
.bar{display:flex;align-items:center;gap:8px;border:1px solid var(--dim);border-radius:8px 8px 0 0;
  padding:9px 14px;background:rgba(61,255,143,.04);color:var(--dim);font-size:12px}
.bar .c{width:11px;height:11px;border-radius:50%;border:1px solid var(--dim)}
.bar .c:nth-child(1){background:#ff5f57;border-color:#ff5f57}
.bar .c:nth-child(2){background:var(--amber);border-color:var(--amber)}
.bar .c:nth-child(3){background:var(--ph);border-color:var(--ph)}
.bar .t{margin-left:auto;letter-spacing:.08em}
.screen{border:1px solid var(--dim);border-top:none;border-radius:0 0 8px 8px;padding:clamp(14px,3vw,28px);background:rgba(3,10,6,.55)}
#log{white-space:pre-wrap;word-break:break-word;min-height:220px}
#log .ok{color:var(--ph)} #log .warn{color:var(--amber)} #log .dim{color:var(--dim)}
.prompt{color:var(--ph);font-weight:700}
.cursor{display:inline-block;width:.6em;height:1.15em;background:var(--ph);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--ph)}
@keyframes blink{50%{opacity:0}}

#card{display:none;margin-top:26px}
.whois{border:1px solid var(--ph-dim);padding:clamp(16px,3vw,26px);position:relative}
.whois::before{content:"// WHOAMI";position:absolute;top:-9px;left:14px;background:var(--bg);padding:0 8px;color:var(--ph);font-size:11px;letter-spacing:.3em}
.name{color:var(--ph);font-weight:700;font-size:clamp(26px,6vw,52px);line-height:1.1;letter-spacing:.02em;text-shadow:0 0 18px rgba(61,255,143,.5)}
.role{color:var(--dim);margin-top:6px}
.role b{color:var(--amber);font-weight:500}
.ascii{color:var(--ph-dim);font-size:10px;line-height:1.2;margin-top:14px;overflow:hidden;white-space:pre}

.cmds{margin-top:24px;display:grid;gap:2px}
.cmds .h{color:var(--dim);margin:14px 0 8px;font-size:12px;letter-spacing:.2em}
a.cmd{display:grid;grid-template-columns:34px 150px 1fr auto;gap:10px;align-items:baseline;
  color:var(--ink);text-decoration:none;padding:8px 10px;border:1px solid transparent;transition:.18s}
a.cmd .n{color:var(--dim)}
a.cmd .k{color:var(--ph);font-weight:500}
a.cmd .v{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.cmd .go{color:var(--amber);opacity:0;transition:.18s}
a.cmd:hover{border-color:var(--ph-dim);background:rgba(61,255,143,.06)}
a.cmd:hover .v{color:var(--ink)} a.cmd:hover .go{opacity:1}
a.cmd:hover .k{text-shadow:0 0 10px var(--ph)}

.langrow{margin-top:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--dim);font-size:12px}
.langrow button{background:none;border:1px solid var(--dim);color:var(--dim);font:inherit;padding:4px 12px;cursor:pointer}
.langrow button.on{color:#03180c;background:var(--ph);border-color:var(--ph)}
.vars{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;gap:6px;font-size:11px}
.vars a{color:var(--dim);text-decoration:none;border:1px solid var(--dim);padding:5px 10px;background:rgba(6,10,7,.7)}
.vars a:hover,.vars a.on{color:var(--ph);border-color:var(--ph)}
@media (max-width:600px){
  a.cmd{grid-template-columns:26px 1fr auto}
  a.cmd .v{display:none}
  .ascii{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="flick"></div><div class="scan"></div><div class="beam"></div><div class="vig"></div>

<div class="term">
  <div class="bar"><span class="c"></span><span class="c"></span><span class="c"></span><span class="t">sergey@parshin: ~/contacts — zsh</span></div>
  <div class="screen">
    <div id="log"></div>

    <div id="card">
      <div class="whois">
        <div class="name" id="nm"></div>
        <div class="role" id="rl"></div>
        <div class="ascii" id="asc"></div>
      </div>
      <div class="cmds" id="cmds"></div>
      <div class="langrow">
        <span id="foot"></span>
        <span><button id="bRu">[ RU ]</button> <button id="bEn">[ EN ]</button></span>
      </div>
    </div>
    <span id="tail"></span><span class="cursor" id="cur"></span>
  </div>
</div>

<div class="vars" id="vars"></div>
<script src="vars.js"></script>

<script>
const LINKS=[
 {k:"phone",  v:"+7 993 000-11-22",          u:"tel:+79930001122"},
 {k:"mail",   v:"info@sergeyparshin.ru",     u:"mailto:info@sergeyparshin.ru"},
 {k:"whatsapp",v:"wa.me/79930001122",        u:"https://wa.me/79930001122"},
 {k:"telegram",v:"t.me/buyholdsellrepeat",   u:"https://t.me/buyholdsellrepeat"},
 {k:"instagram",v:"instagram.com/sergeyparshin.ru", u:"https://instagram.com/sergeyparshin.ru"},
 {k:"x",      v:"x.com/sergeyparshin",       u:"https://x.com/sergeyparshin"},
 {k:"facebook",v:"facebook.com/sergeyparshin.ru", u:"https://facebook.com/sergeyparshin.ru"},
 {k:"github", v:"github.com/sergeyparshin",  u:"https://github.com/sergeyparshin"},
 {k:"steam",  v:"steamcommunity.com/id/sergeyparshin", u:"https://steamcommunity.com/id/sergeyparshin"}
];
const T={
 ru:{boot:[["dim","[ BIOS ] neural-core v13.37 ... OK"],["dim","[ MEM  ] 640K ought to be enough ... OK"],["ok","[ NET  ] uplink established :: sergeyparshin.ru"],["warn","[ AI   ] loading deep-learning modules ██████████ 100%"],["ok","[ OK   ] identity verified — Sergey Parshin"],["", ""],["prompt","sergey@parshin:~$ whoami --contacts"]],
     name:"СЕРГЕЙ ПАРШИН", role:"AI Specialist :: <b>нейросети · deep learning · engineering</b>",
     head:"$ ls -la ./contacts  # 9 объектов найдено", foot:"© 2026 Сергей Паршин :: uptime ∞ :: Moscow UTC+3"},
 en:{boot:[["dim","[ BIOS ] neural-core v13.37 ... OK"],["dim","[ MEM  ] 640K ought to be enough ... OK"],["ok","[ NET  ] uplink established :: sergeyparshin.ru"],["warn","[ AI   ] loading deep-learning modules ██████████ 100%"],["ok","[ OK   ] identity verified — Sergey Parshin"],["", ""],["prompt","sergey@parshin:~$ whoami --contacts"]],
     name:"SERGEY PARSHIN", role:"AI Specialist :: <b>neural nets · deep learning · engineering</b>",
     head:"$ ls -la ./contacts  # 9 objects found", foot:"© 2026 Sergey Parshin :: uptime ∞ :: Moscow UTC+3"}
};
const ASCII={
 ru:"  ███████╗██████╗ \n  ██╔════╝██╔══██╗\n  ███████╗██████╔╝\n  ╚════██║██╔═══╝ \n  ███████║██║     \n  ╚══════╝╚═╝     ",
 en:"  ███████╗██████╗ \n  ██╔════╝██╔══██╗\n  ███████╗██████╔╝\n  ╚════██║██╔═══╝ \n  ███████║██║     \n  ╚══════╝╚═╝     "
};
let lang=localStorage.getItem('sp-lang')||(((navigator.language||'ru').startsWith('ru'))?'ru':'en');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const log=document.getElementById('log'),card=document.getElementById('card'),tail=document.getElementById('tail');

function renderCard(){
  const t=T[lang];
  document.getElementById('nm').textContent=t.name;
  document.getElementById('rl').innerHTML=t.role;
  document.getElementById('asc').textContent=ASCII[lang];
  document.getElementById('foot').textContent=t.foot;
  document.getElementById('bRu').classList.toggle('on',lang==='ru');
  document.getElementById('bEn').classList.toggle('on',lang==='en');
  document.documentElement.lang=lang;
  const c=document.getElementById('cmds');c.innerHTML='';
  const h=document.createElement('div');h.className='h';h.textContent=t.head;c.appendChild(h);
  LINKS.forEach((L,i)=>{
    const a=document.createElement('a');a.className='cmd';a.href=L.u;
    if(!L.u.startsWith('tel:')&&!L.u.startsWith('mailto:')){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`<span class="n">0${i+1}</span><span class="k">./open ${L.k}</span><span class="v">${L.v}</span><span class="go">→ exec</span>`;
    c.appendChild(a);
  });
}
document.getElementById('bRu').onclick=()=>{lang='ru';localStorage.setItem('sp-lang',lang);renderCard();};
document.getElementById('bEn').onclick=()=>{lang='en';localStorage.setItem('sp-lang',lang);renderCard();};

async function boot(){
  renderCard();
  if(reduced){card.style.display='block';tail.innerHTML='<span class="prompt">sergey@parshin:~$ </span>';return;}
  for(const [cls,line] of T[lang].boot){
    const div=document.createElement('div');if(cls)div.className=cls;log.appendChild(div);
    for(let i=0;i<=line.length;i++){div.textContent=line.slice(0,i);await sleep(cls==='prompt'?34:8);}
    await sleep(120);
  }
  await sleep(250);
  card.style.display='block';
  card.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:400,easing:'ease-out'});
  tail.innerHTML='<span class="prompt">sergey@parshin:~$ </span>';
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
boot();
</script>
</body>
</html>
