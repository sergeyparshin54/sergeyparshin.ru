<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сергей Паршин — PARTICLES</title>
<meta name="description" content="Сергей Паршин — AI-специалист. Контакты и соцсети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--ink:#dfe8ff;--dim:#5d6a85;--acc:#6ee7ff;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow-x:hidden;
  display:flex;flex-direction:column;min-height:100svh}
::selection{background:var(--acc);color:#02222e}
#pc{position:relative;z-index:1;width:100%;height:58svh;min-height:300px;display:block;touch-action:none}
.panel{position:relative;z-index:2;max-width:760px;width:100%;margin:0 auto;padding:0 clamp(16px,4vw,32px) 90px}
.role{font-size:11px;letter-spacing:.42em;color:var(--acc);text-transform:uppercase;margin-bottom:26px}
.list{display:flex;flex-direction:column;border-top:1px solid rgba(110,231,255,.14)}
a.row{display:flex;align-items:center;gap:16px;padding:13px 4px;color:var(--ink);text-decoration:none;
  border-bottom:1px solid rgba(110,231,255,.14);font-size:clamp(13px,1.8vw,15px);transition:.25s}
a.row .no{font-size:10px;color:var(--dim);width:22px}
a.row .nm{font-weight:500}
a.row .v{margin-left:auto;color:var(--dim);font-size:clamp(10px,1.4vw,12px);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw;transition:.25s}
a.row:hover{padding-left:12px;color:var(--acc)}
a.row:hover .v{color:var(--ink)}
.foot{margin-top:30px;font-size:10px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
.langs{position:fixed;top:20px;right:20px;z-index:9;display:flex;gap:4px}
.langs button{background:rgba(5,7,15,.7);border:1px solid rgba(110,231,255,.25);color:var(--dim);font:inherit;font-size:10px;letter-spacing:.2em;padding:5px 12px;cursor:pointer;border-radius:99px}
.langs button.on{color:#02222e;background:var(--acc);border-color:var(--acc)}
.vars{position:fixed;right:10px;bottom:10px;z-index:9;display:flex;flex-wrap:wrap;gap:4px;font-size:10px;max-width:60vw;justify-content:flex-end}
.vars a{color:var(--dim);text-decoration:none;border:1px solid rgba(110,231,255,.25);padding:4px 9px;border-radius:99px;background:rgba(5,7,15,.8)}
.vars a.on{color:var(--acc);border-color:var(--acc)}
@media (max-width:560px){a.row .v{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="langs"><button id="bRu">RU</button><button id="bEn">EN</button></div>
<canvas id="pc"></canvas>

<div class="panel">
  <div class="role" data-i18n="role">AI Specialist · Deep Learning</div>
  <nav class="list" id="list"></nav>
  <div class="foot" data-i18n="foot">© 2026 Сергей Паршин · Moscow UTC+3</div>
</div>

<script>
const T={
 ru:{role:"AI Specialist · Deep Learning",foot:"© 2026 Сергей Паршин · Moscow UTC+3",name:"СЕРГЕЙ ПАРШИН",
     labels:{phone:"Телефон",mail:"Почта",whatsapp:"WhatsApp",telegram:"Telegram",instagram:"Instagram",x:"Twitter",facebook:"Facebook",github:"GitHub",steam:"Steam"}},
 en:{role:"AI Specialist · Deep Learning",foot:"© 2026 Sergey Parshin · Moscow UTC+3",name:"SERGEY PARSHIN",
     labels:{phone:"Phone",mail:"Email",whatsapp:"WhatsApp",telegram:"Telegram",instagram:"Instagram",x:"Twitter",facebook:"Facebook",github:"GitHub",steam:"Steam"}}
};
const LINKS=[
 {k:"phone",v:"+7 993 000-11-22",u:"tel:+79930001122"},{k:"mail",v:"info@sergeyparshin.ru",u:"mailto:info@sergeyparshin.ru"},
 {k:"whatsapp",v:"wa.me/79930001122",u:"https://wa.me/79930001122"},{k:"telegram",v:"t.me/buyholdsellrepeat",u:"https://t.me/buyholdsellrepeat"},
 {k:"instagram",v:"instagram.com/sergeyparshin.ru",u:"https://instagram.com/sergeyparshin.ru"},{k:"x",v:"x.com/sergeyparshin",u:"https://x.com/sergeyparshin"},
 {k:"facebook",v:"facebook.com/sergeyparshin.ru",u:"https://facebook.com/sergeyparshin.ru"},{k:"github",v:"github.com/sergeyparshin",u:"https://github.com/sergeyparshin"},
 {k:"steam",v:"steamcommunity.com/id/sergeyparshin",u:"https://steamcommunity.com/id/sergeyparshin"}
];
let lang=localStorage.getItem('sp-lang')||(((navigator.language||'ru').startsWith('ru'))?'ru':'en');
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=T[lang][el.dataset.i18n]);
  document.getElementById('bRu').classList.toggle('on',lang==='ru');
  document.getElementById('bEn').classList.toggle('on',lang==='en');
  const l=document.getElementById('list');l.innerHTML='';
  LINKS.forEach((L,i)=>{
    const a=document.createElement('a');a.className='row';a.href=L.u;
    if(!L.u.startsWith('tel:')&&!L.u.startsWith('mailto:')){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`<span class="no">0${i+1}</span><span class="nm">${T[lang].labels[L.k]}</span><span class="v">${L.v}</span>`;
    l.appendChild(a);
  });
  buildParticles();
}
document.getElementById('bRu').onclick=()=>{lang='ru';localStorage.setItem('sp-lang',lang);render();};
document.getElementById('bEn').onclick=()=>{lang='en';localStorage.setItem('sp-lang',lang);render();};

/* particle text */
const cv=document.getElementById('pc'),cx=cv.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let P=[],mouse={x:-9e3,y:-9e3},running=false;
function buildParticles(){
  const W=cv.width=cv.clientWidth*devicePixelRatio;
  const H=cv.height=cv.clientHeight*devicePixelRatio;
  const off=document.createElement('canvas');off.width=W;off.height=H;
  const oc=off.getContext('2d');
  const fs=Math.min(W/ (T[lang].name.length*0.62), H*0.42);
  oc.font=`800 ${fs}px Unbounded,sans-serif`;
  oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle='#fff';
  oc.fillText(T[lang].name,W/2,H/2);
  const data=oc.getImageData(0,0,W,H).data;
  P=[];
  const gap=Math.max(3,Math.round(4*devicePixelRatio));
  for(let y=0;y<H;y+=gap)for(let x=0;x<W;x+=gap){
    if(data[(y*W+x)*4+3]>128){
      P.push({hx:x,hy:y,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,
        c:Math.random()<.12?'110,231,255':'223,232,255'});
    }
  }
  if(!running){running=true;loop();}
}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*devicePixelRatio;mouse.y=(e.clientY-r.top)*devicePixelRatio;});
cv.addEventListener('pointerleave',()=>{mouse.x=-9e3;mouse.y=-9e3;});
const R=90*devicePixelRatio;
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of P){
    if(!reduced){
      const dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy;
      if(d2<R*R){const d=Math.sqrt(d2)||1,f=(1-d/R)*4.2;p.vx+=dx/d*f;p.vy+=dy/d*f;}
      p.vx+=(p.hx-p.x)*.045;p.vy+=(p.hy-p.y)*.045;
      p.vx*=.86;p.vy*=.86;
      p.x+=p.vx;p.y+=p.vy;
    }else{p.x=p.hx;p.y=p.hy;}
    cx.fillStyle=`rgba(${p.c},.9)`;
    cx.fillRect(p.x,p.y,devicePixelRatio*1.4,devicePixelRatio*1.4);
  }
  requestAnimationFrame(loop);
}
document.fonts?document.fonts.ready.then(render):render();
addEventListener('resize',()=>buildParticles());
</script>
<div class="vars" id="vars"></div>
<script src="vars.js"></script>
</body>
</html>
