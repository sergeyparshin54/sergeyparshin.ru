:root{--bg:#060a07;--ph:#3dff8f;--ph-dim:#1d7a4a;--amber:#ffc857;--ink:#c9e8d4;--dim:#8ba896;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size-adjust:from-font;overflow-x:hidden}
::selection{background:var(--ph);color:#03180c}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.beam{position:fixed;left:0;right:0;top:-140px;height:120px;z-index:6;pointer-events:none;opacity:.06;background:linear-gradient(180deg,transparent,var(--ph),transparent)}
@media (prefers-reduced-motion:no-preference){.beam{animation:beam 6s linear infinite}}
@keyframes beam{from{transform:translateY(0)}to{transform:translateY(110vh)}}
.flick{position:fixed;inset:0;z-index:4;pointer-events:none;background:rgba(61,255,143,.03);animation:fl 4s steps(2) infinite}
@keyframes fl{0%,100%{opacity:.6}50%{opacity:.2}}
.vig{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(90% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.6))}
.term{position:relative;z-index:3;max-width:860px;margin:0 auto;min-height:100vh;min-height:100svh;padding:clamp(1rem,4vw,2.75rem);font-size:clamp(.75rem,1.7vw,.9375rem);line-height:1.75;text-shadow:0 0 6px rgba(61,255,143,.35)}
.bar{display:flex;align-items:center;gap:8px;border:1px solid var(--dim);border-radius:8px 8px 0 0;padding:9px 14px;background:rgba(61,255,143,.04);color:var(--dim);font-size:.75rem}
.bar .c{width:11px;height:11px;border-radius:50%;border:1px solid var(--dim)}
.bar .c:nth-child(1){background:#ff5f57;border-color:#ff5f57}.bar .c:nth-child(2){background:var(--amber);border-color:var(--amber)}.bar .c:nth-child(3){background:var(--ph);border-color:var(--ph)}
.bar .t{margin-left:auto;letter-spacing:.08em}
.screen{border:1px solid var(--dim);border-top:none;border-radius:0 0 8px 8px;padding:clamp(14px,3vw,28px);background:rgba(3,10,6,.55)}
#log{white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px}
#log .ok{color:var(--ph)} #log .warn{color:var(--amber)} #log .dim{color:var(--dim)}
.prompt{color:var(--ph);font-weight:700}
.cursor{display:inline-block;width:.6em;height:1.15em;background:var(--ph);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--ph)}
@keyframes blink{50%{opacity:0}}
#card{display:none;margin-top:26px}
.whois{border:1px solid var(--ph-dim);padding:clamp(16px,3vw,26px);position:relative}
.whois::before{content:"~/dev/neural :: stream" / "";position:absolute;top:-9px;left:14px;background:var(--bg);padding:0 8px;color:var(--ph);font-size:.6875rem;letter-spacing:.18em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.nanim{position:relative;margin:0;font-size:min(.59375rem,calc((100vw - 110px)/66));line-height:1.16;user-select:none}
.nanim pre{font-family:inherit;margin:0;white-space:pre;line-height:inherit;font-size:inherit;overflow:hidden}
.nanim .nz{color:var(--ph-dim);opacity:.5}
.nanim .nm{position:absolute;inset:0;color:var(--ph);text-shadow:0 0 12px rgba(61,255,143,.55)}
.cmds{margin-top:24px;display:grid;gap:2px}
.cmds .h{color:var(--dim);margin:14px 0 8px;font-size:.75rem;letter-spacing:.2em}
a.cmd{display:grid;grid-template-columns:34px 150px 1fr auto;gap:10px;align-items:baseline;color:var(--ink);text-decoration:none;padding:8px 10px;border:1px solid transparent;transition:color .18s,background-color .18s,border-color .18s;min-height:44px}
a.cmd .n{color:var(--dim)}a.cmd .k{color:var(--ph);font-weight:500}a.cmd .v{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}a.cmd .go{color:var(--amber);opacity:0;transition:opacity .18s}
a.cmd:hover{border-color:var(--ph-dim);background:rgba(61,255,143,.06)}a.cmd:hover .v{color:var(--ink)}a.cmd:hover .go{opacity:1}a.cmd:hover .k{text-shadow:0 0 10px var(--ph)}
a.cmd:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.langrow{margin-top:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--dim);font-size:.75rem}
.langrow button{background:none;border:1px solid var(--dim);color:var(--ink);font:inherit;padding:8px 12px;cursor:pointer;min-height:44px}
.langrow button:hover{border-color:var(--ph);color:var(--ph)}
body.motion-paused .beam,body.motion-paused .flick,body.motion-paused .cursor{animation:none}
@media (max-width:600px){a.cmd{grid-template-columns:26px 1fr auto}a.cmd .v{display:none}.bar .t{letter-spacing:0}}
@media (pointer:coarse){a.cmd,.langrow button{min-height:48px}}
@media (prefers-reduced-motion:reduce){.beam,.flick,.cursor{animation:none}a.cmd,a.cmd .go{transition:none}}

<script>

 {k:"github",v:"github.com/sergeyparshin",u:"https://github.com/sergeyparshin"},
 {k:"steam",v:"steamcommunity.com/id/sergeyparshin",u:"https://steamcommunity.com/id/sergeyparshin"},
 {k:"chess",v:"chess.com/member/sergeyparshin",u:"https://www.chess.com/member/sergeyparshin"}
];
const T={
 en:{boot:[["dim","[ BIOS ] neural-core v13.37 ... OK"],["dim","[ MEM  ] 640K ought to be enough ... OK"],["ok","[ NET  ] uplink established :: sergeyparshin.ru"],["warn","[ AI   ] loading deep-learning modules ██████████ 100%"],["ok","[ OK   ] identity verified — Sergey Parshin"],["",""],["prompt","@sergeyparshin:~$ whoami --contacts"]],head:"$ ls -la ./contacts  # 11 objects found",foot:"© 2026 Sergey Parshin :: uptime ∞ :: Moscow UTC+3"}
};
const lang='en';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const log=document.getElementById('log'),card=document.getElementById('card'),tail=document.getElementById('tail');
const motionButton=document.getElementById('motion-toggle');
let motionPaused=false,animationTimer=null;
function setMotionPaused(paused){
  motionPaused=paused;
  document.body.classList.toggle('motion-paused',paused);
  motionButton.textContent=paused?'Resume motion':'Pause motion';
  if(animationTimer!==null){clearInterval(animationTimer);animationTimer=null;}
  if(!paused)startName();
}
motionButton.addEventListener('click',()=>setMotionPaused(!motionPaused));
function renderCard(){
  const t=T[lang];
  document.getElementById('foot').textContent=t.foot;
  document.documentElement.lang=lang;
  const c=document.getElementById('cmds');c.innerHTML='';
  const h=document.createElement('div');h.className='h';h.textContent=t.head;c.appendChild(h);
  LINKS.forEach((L,i)=>{
    const a=document.createElement('a');a.className='cmd';a.href=L.u;
    if(!L.u.startsWith('tel:')&&!L.u.startsWith('mailto:')){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span><span class="k">./open ${L.k}</span><span class="v">${L.v}</span><span class="go">→ exec</span>`;
    c.appendChild(a);
  });
}
async function boot(){
  renderCard();
  if(reduced){card.style.display='block';motionButton.hidden=true;startName();tail.innerHTML='';return;}
  for(const [cls,line] of T[lang].boot){
    const div=document.createElement('div');if(cls)div.className=cls;log.appendChild(div);
    for(let i=0;i<=line.length;i++){div.textContent=line.slice(0,i);await sleep(cls==='prompt'?34:8);}
    await sleep(120);
  }
  await sleep(250);
  card.style.display='block';
  card.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:400,easing:'ease-out'});
  tail.innerHTML='';
  startName();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function startName(){
  const box=document.getElementById('nanim');
  if(!box||motionPaused)return;
  const RW=110,RH=12;
  const nz=document.createElement('pre');nz.className='nz';
  const nm=document.createElement('pre');nm.className='nm';
  box.replaceChildren(nz,nm);
  const LO=' .:-',HI='=+*#%@';
  function frame(t0,glitch){
    let nOut='',lOut='';
    for(let y=0;y<RH;y++){
      for(let x=0;x<RW;x++){
        const dx=x-RW/2,dy=(y-RH/2)*2;
        const v=Math.sin(x*.21+t0)+Math.sin(y*.55-t0*.7)+Math.sin((x+y)*.14+t0*.5)+Math.sin(Math.sqrt(dx*dx+dy*dy)*.3-t0*1.3);
        const k=(v+4)/8;
        if(glitch&&Math.random()<.02){nOut+='@#%&'[Math.floor(Math.random()*4)];lOut+=' ';}
        else if(k>.55){lOut+=HI[Math.min(HI.length-1,Math.floor((k-.55)/.45*HI.length))];nOut+=' ';}
        else{nOut+=LO[Math.min(LO.length-1,Math.floor(k/.55*LO.length))];lOut+=' ';}
      }
      nOut+='\n';lOut+='\n';
    }
    nz.textContent=nOut;nm.textContent=lOut;
  }
  frame(0,false);
  if(reduced)return;
  let t0=0,glitchUntil=0,nextGlitch=performance.now()+4000;
  animationTimer=setInterval(()=>{t0+=.12;
    const now=performance.now();
    if(now>nextGlitch){glitchUntil=now+220;nextGlitch=now+5000+Math.random()*4000;}
    frame(t0,now<glitchUntil);
  },80);
}
boot();
</script>
