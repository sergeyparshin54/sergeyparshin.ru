<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сергей Паршин — ENTER THE MATRIX</title>
<meta name="description" content="Сергей Паршин — AI-специалист. Контакты и соцсети.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000802;--gr:#00ff41;--gr-dim:#0a5c22;--ink:#b8ffd0;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow-x:hidden}
::selection{background:var(--gr);color:#001805}
#rain{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:2;min-height:100svh;max-width:820px;margin:0 auto;
  display:flex;flex-direction:column;justify-content:center;padding:70px clamp(18px,5vw,48px) 80px}
.kick{font-size:11px;letter-spacing:.4em;color:var(--gr);text-transform:uppercase;text-shadow:0 0 10px var(--gr)}
h1{font-weight:700;font-size:clamp(34px,8vw,80px);line-height:1.05;margin:18px 0 8px;color:#eafff0;
  text-shadow:0 0 24px rgba(0,255,65,.55),0 0 4px rgba(0,255,65,.9);min-height:1.05em}
.sub{color:#5fae7c;font-weight:300;font-size:clamp(12px,1.6vw,14px);letter-spacing:.06em;margin-bottom:40px}
.sub::before{content:"> ";color:var(--gr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
a.cell{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
  border:1px solid var(--gr-dim);padding:14px 16px;background:rgba(0,12,4,.72);backdrop-filter:blur(3px);
  transition:.2s;position:relative;overflow:hidden}
a.cell .tag{font-size:10px;color:var(--gr);letter-spacing:.2em;width:66px;flex:none}
a.cell .val{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,255,65,.16),transparent);
  transform:translateX(-100%)}
a.cell:hover{border-color:var(--gr);box-shadow:0 0 22px rgba(0,255,65,.28),inset 0 0 14px rgba(0,255,65,.1);color:#eafff0}
a.cell:hover::before{transform:translateX(100%);transition:transform .5s}
.foot{margin-top:44px;font-size:10.5px;letter-spacing:.25em;color:#3f7a52;text-transform:uppercase}
.langs{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:4px}
.langs button{background:rgba(0,12,4,.8);border:1px solid var(--gr-dim);color:#5fae7c;font:inherit;font-size:10px;letter-spacing:.2em;padding:5px 12px;cursor:pointer}
.langs button.on{color:#001805;background:var(--gr);border-color:var(--gr)}
.vars{position:fixed;right:10px;bottom:10px;z-index:9;display:flex;flex-wrap:wrap;gap:4px;font-size:10px;max-width:60vw;justify-content:flex-end}
.vars a{color:#5fae7c;text-decoration:none;border:1px solid var(--gr-dim);padding:4px 9px;background:rgba(0,8,2,.8)}
.vars a.on{color:var(--gr);border-color:var(--gr)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="langs"><button id="bRu">RU</button><button id="bEn">EN</button></div>

<div class="wrap">
  <div class="kick" data-i18n="kick">wake up, neo…</div>
  <h1 id="name"></h1>
  <div class="sub" data-i18n="sub">следуй за белым кроликом: все контакты ниже</div>
  <div class="grid" id="grid"></div>
  <div class="foot" data-i18n="foot">© 2026 · сергей паршин · the matrix has you</div>
</div>

<script>
const T={
 ru:{kick:"проснись, нео…",name:"СЕРГЕЙ ПАРШИН",sub:"следуй за белым кроликом: все контакты ниже",foot:"© 2026 · сергей паршин · the matrix has you",
     labels:{phone:"Телефон",mail:"Почта",whatsapp:"WhatsApp",telegram:"Telegram",instagram:"Instagram",x:"Twitter",facebook:"Facebook",github:"GitHub",steam:"Steam"}},
 en:{kick:"wake up, neo…",name:"SERGEY PARSHIN",sub:"follow the white rabbit: every contact below",foot:"© 2026 · sergey parshin · the matrix has you",
     labels:{phone:"Phone",mail:"Email",whatsapp:"WhatsApp",telegram:"Telegram",instagram:"Instagram",x:"Twitter",facebook:"Facebook",github:"GitHub",steam:"Steam"}}
};
const LINKS=[
 {k:"phone",v:"+7 993 000-11-22",u:"tel:+79930001122"},{k:"mail",v:"info@sergeyparshin.ru",u:"mailto:info@sergeyparshin.ru"},
 {k:"whatsapp",v:"wa.me/79930001122",u:"https://wa.me/79930001122"},{k:"telegram",v:"t.me/buyholdsellrepeat",u:"https://t.me/buyholdsellrepeat"},
 {k:"instagram",v:"instagram.com/sergeyparshin.ru",u:"https://instagram.com/sergeyparshin.ru"},{k:"x",v:"x.com/sergeyparshin",u:"https://x.com/sergeyparshin"},
 {k:"facebook",v:"facebook.com/sergeyparshin.ru",u:"https://facebook.com/sergeyparshin.ru"},{k:"github",v:"github.com/sergeyparshin",u:"https://github.com/sergeyparshin"},
 {k:"steam",v:"steamcommunity.com/id/sergeyparshin",u:"https://steamcommunity.com/id/sergeyparshin"}
];
let lang=localStorage.getItem('sp-lang')||(((navigator.language||'ru').startsWith('ru'))?'ru':'en');
const GL='アイウエオカキクケコサシスセソ01<>*+=#АБВГДЕЖЗИК';

/* glyph decode effect */
function decode(el,text,speed=28){
  let f=0;clearInterval(el._t);
  el._t=setInterval(()=>{
    el.textContent=[...text].map((c,i)=> i<f? c : GL[Math.random()*GL.length|0]).join('');
    if(f++>text.length)clearInterval(el._t);
  },speed);
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=T[lang][el.dataset.i18n]);
  document.getElementById('bRu').classList.toggle('on',lang==='ru');
  document.getElementById('bEn').classList.toggle('on',lang==='en');
  decode(document.getElementById('name'),T[lang].name,55);
  const g=document.getElementById('grid');g.innerHTML='';
  LINKS.forEach((L,i)=>{
    const a=document.createElement('a');a.className='cell';a.href=L.u;
    if(!L.u.startsWith('tel:')&&!L.u.startsWith('mailto:')){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`<span class="tag">${T[lang].labels[L.k].toUpperCase().slice(0,7)}</span><span class="val">${L.v}</span>`;
    a.addEventListener('pointerenter',()=>decode(a.querySelector('.val'),L.v,22));
    g.appendChild(a);
    setTimeout(()=>decode(a.querySelector('.val'),L.v,22), 400+i*120);
  });
}
document.getElementById('bRu').onclick=()=>{lang='ru';localStorage.setItem('sp-lang',lang);render();};
document.getElementById('bEn').onclick=()=>{lang='en';localStorage.setItem('sp-lang',lang);render();};
render();

/* digital rain */
const cv=document.getElementById('rain'),cx=cv.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,cols,drops,FS=15;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/FS);
  drops=Array.from({length:cols},()=>Math.random()*-H/FS);}
addEventListener('resize',rs);rs();
const RG='アイウエオカキクケコサシスセソ0123456789';
if(!reduced){
  setInterval(()=>{
    cx.fillStyle='rgba(0,8,2,.09)';cx.fillRect(0,0,W,H);
    cx.font=FS+'px JetBrains Mono,monospace';
    for(let i=0;i<cols;i++){
      const ch=RG[Math.random()*RG.length|0];
      cx.fillStyle=Math.random()<.06?'#baffd0':'rgba(0,255,65,.75)';
      cx.fillText(ch,i*FS,drops[i]*FS);
      if(drops[i]*FS>H&&Math.random()>.976)drops[i]=0;
      drops[i]+= .5+Math.random()*.5;
    }
  },50);
}
</script>
<div class="vars" id="vars"></div>
<script src="vars.js"></script>
</body>
</html>
