<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;900&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf6ff;--dim:#68809a;--acc:#4de3ff;--acc2:#c86bff;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#02030a;color:var(--ink);font-family:'JetBrains Mono',monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:#02131a}
#gl{position:fixed;inset:0;z-index:0}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none}
.hud .corner{position:absolute;width:26px;height:26px;border:1px solid rgba(120,200,255,.35)}
.hud .tl{top:18px;left:18px;border-right:none;border-bottom:none}
.hud .tr{top:18px;right:18px;border-left:none;border-bottom:none}
.hud .bl{bottom:18px;left:18px;border-right:none;border-top:none}
.hud .br{bottom:18px;right:18px;border-left:none;border-top:none}
.hud .meta{position:absolute;font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.hud .m1{top:26px;left:58px}.hud .m2{top:26px;right:58px}
.hud .m3{bottom:26px;left:58px;font-variant-numeric:tabular-nums}
.hud .m4{bottom:26px;right:58px}
.hud .cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.4}
.hud .cross::before,.hud .cross::after{content:"";position:absolute;background:var(--acc)}
.hud .cross::before{left:50%;top:0;width:1px;height:100%}
.hud .cross::after{top:50%;left:0;height:1px;width:100%}

.stage{position:relative;z-index:3;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.id{font-size:11px;letter-spacing:.5em;color:var(--acc);text-transform:uppercase;margin-bottom:22px;animation:fade 1.4s .2s both}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(34px,9vw,96px);line-height:.98;letter-spacing:.01em;
  mix-blend-mode:screen;text-shadow:0 0 40px rgba(77,227,255,.35);animation:fade 1.4s .45s both}
h1 small{display:block;font-weight:300;font-size:.42em;letter-spacing:.34em;color:var(--dim);margin-top:14px;-webkit-text-stroke:0}
.role{margin-top:20px;font-size:clamp(11px,1.5vw,13px);color:var(--dim);letter-spacing:.2em;animation:fade 1.4s .7s both}
.role b{color:var(--acc2);font-weight:500}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.dock{margin-top:clamp(30px,6vh,56px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:760px;animation:fade 1.4s .95s both}
a.chip{--h:190;pointer-events:auto;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
  font-size:12px;letter-spacing:.06em;padding:10px 16px;border:1px solid rgba(120,200,255,.22);
  background:rgba(4,10,24,.45);backdrop-filter:blur(8px);position:relative;overflow:hidden;transition:.3s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
a.chip svg{width:15px;height:15px;fill:var(--dim);transition:.3s;flex:none}
a.chip::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(77,227,255,.18),transparent);transform:translateX(-100%);transition:transform .5s}
a.chip:hover{border-color:var(--acc);color:#fff;box-shadow:0 0 24px rgba(77,227,255,.25),inset 0 0 18px rgba(77,227,255,.08)}
a.chip:hover::before{transform:translateX(100%)}
a.chip:hover svg{fill:var(--acc)}

.langs{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:4px}
.langs button{background:rgba(4,10,24,.5);border:1px solid rgba(120,200,255,.22);color:var(--dim);font:inherit;font-size:10px;letter-spacing:.2em;padding:5px 12px;cursor:pointer;backdrop-filter:blur(6px)}
.langs button.on{color:#02131a;background:var(--acc);border-color:var(--acc)}
.vars{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;gap:6px;font-size:11px}
.vars a{color:var(--dim);text-decoration:none;border:1px solid rgba(120,200,255,.22);padding:5px 10px;background:rgba(2,3,10,.6);backdrop-filter:blur(6px)}
.vars a:hover,.vars a.on{color:var(--acc);border-color:var(--acc)}
@media (max-width:560px){.hud .m2,.hud .m4{display:none}.dock{gap:6px}a.chip{padding:9px 12px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

</div>

<main class="stage">

  <nav class="dock" id="dock"></nav>
</main>

<div class="vars" id="vars"></div>
<script src="vars.js"></script>

 {k:"instagram",u:"https://instagram.com/sergeyparshin.ru"},{k:"x",u:"https://x.com/sergeyparshin"},

const ICONS={

 whatsapp:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.4-3c-.3-.4 0-.5.1-.7l.4-.5c.1-.2.1-.3 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9a11.6 11.6 0 0 0 4.5 4.2c1.7.8 2.4.9 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3z"/></svg>',

 x:'<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23.3 22h-6.3l-4.9-6.4L6.5 22H3.4l7.3-8.3L1 2h6.5l4.4 5.9L18.9 2zm-1.1 18h1.7L7.1 3.9H5.3L17.8 20z"/></svg>',
 facebook:'<svg viewBox="0 0 24 24"><path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21h3.4z"/></svg>',

 steam:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-10 9.5l5.4 2.2a2.8 2.8 0 0 1 1.6-.5l2.4-3.5v-.1a3.8 3.8 0 1 1 3.8 3.8h-.1l-3.4 2.5c0 .1.1.3.1.4a2.9 2.9 0 0 1-5.7.7l-3.9-1.6A10 10 0 1 0 12 2zM7.5 18.6l1.2.5a2.1 2.1 0 1 0 1.1-2.8l1.3.6a1.6 1.6 0 1 1-1.6 1.6l-2 .1zm8-6.6a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0zm-4.2 0a1.7 1.7 0 1 1 3.4 0 1.7 1.7 0 0 1-3.4 0z"/></svg>'
};
let lang=localStorage.getItem('sp-lang')||(((navigator.language||'ru').startsWith('ru'))?'ru':'en');
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=T[lang][el.dataset.i18n]);
  document.getElementById('bRu').classList.toggle('on',lang==='ru');
  document.getElementById('bEn').classList.toggle('on',lang==='en');
  const d=document.getElementById('dock');d.innerHTML='';
  LINKS.forEach(L=>{
    const a=document.createElement('a');a.className='chip';a.href=L.u;
    if(!L.u.startsWith('tel:')&&!L.u.startsWith('mailto:')){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`${ICONS[L.k]}<span>${T[lang].labels[L.k]}</span>`;
    d.appendChild(a);
  });
}
document.getElementById('bRu').onclick=()=>{lang='ru';localStorage.setItem('sp-lang',lang);render();};
document.getElementById('bEn').onclick=()=>{lang='en';localStorage.setItem('sp-lang',lang);render();};
render();

/* coords readout */
const co=document.getElementById('coords');
addEventListener('pointermove',e=>{co.textContent=`X ${String(e.clientX).padStart(4,'0')} · Y ${String(e.clientY).padStart(4,'0')}`;});

/* WebGL domain-warped fbm */
const cv=document.getElementById('gl'),gl=cv.getContext('webgl');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(gl){
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 R;uniform float T;uniform vec2 M;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 float t=T*.05;
 vec2 q=vec2(fbm(uv*1.6+t),fbm(uv*1.6+vec2(5.2,1.3)-t));
 vec2 r=vec2(fbm(uv*1.6+3.2*q+vec2(1.7,9.2)+t*.7),fbm(uv*1.6+3.2*q+vec2(8.3,2.8)-t*.6));
 float f=fbm(uv*1.6+3.5*r);
 vec3 c1=vec3(.008,.012,.04);
 vec3 c2=vec3(.05,.35,.55);
 vec3 c3=vec3(.45,.15,.65);
 vec3 c4=vec3(.1,.9,1.);
 vec3 col=mix(c1,c2,clamp(f*f*2.6,0.,1.));
 col=mix(col,c3,clamp(length(q)*.5,0.,1.)*.6);
 col=mix(col,c4,pow(clamp(r.y,0.,1.),3.)*.8);
 float d=length(uv-M*.5);
 col+=c4*exp(-d*4.)*.12;
 float g=smoothstep(1.4,.3,length(uv));
 col*=mix(.55,1.,g);
 gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uM=gl.getUniformLocation(pr,'M');
let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1);});
function rs(){cv.width=innerWidth*Math.min(devicePixelRatio,1.5);cv.height=innerHeight*Math.min(devicePixelRatio,1.5);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',rs);rs();
(function loop(t){
 gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,reduced?0:t*.001);gl.uniform2f(uM,mx,my);
 gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop);
})(0);
}
</script>
